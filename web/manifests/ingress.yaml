apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: topologist-web-ingress
  namespace: topologist
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: topologist-web-service
                port:
                  number: 80
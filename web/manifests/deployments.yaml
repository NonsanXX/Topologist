apiVersion: apps/v1
kind: Deployment
metadata:
  name: topologist-web
  namespace: topologist
spec:
  replicas: 2
  selector:
    matchLabels:
      app: topologist-web
  template:
    metadata:
      labels:
        app: topologist-web
    spec:
      containers:
        - name: topologist-web
          image: nonsanxx/topologist-web:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: "env" # ชื่อ secret ให้ตรงกับที่เราสร้าง secret ใน rancher
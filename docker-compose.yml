services:
  mongo:
    image: mongo:6
    ports: [ "27017:27017" ]
    volumes:
      - mongo-data:/data/db
    networks:
      - app-net
    env_file: .env

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672" # UI
      - "5672:5672" # AMQP
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - app-net
    env_file: .env

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    env_file: .env
    environment:
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${MONGO_HOST}:27017
      - DB_NAME=${DB_NAME}
    networks:
      - app-net
    depends_on: [ mongo, rabbitmq ]
    ports: [ "5001:5001" ]

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${MONGO_HOST}:27017
      - DB_NAME=${DB_NAME}
    networks:
      - app-net
    depends_on: [ rabbitmq, mongo ]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: .env
    environment:
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${MONGO_HOST}:27017
      - DB_NAME=${DB_NAME}
      - SCHEDULER_URL=http://scheduler:5001
    networks:
      - app-net
    ports: [ "8000:8000" ]
    depends_on: [ mongo, scheduler ]

volumes:
  mongo-data:
  rabbitmq-data:

networks:
  app-net:

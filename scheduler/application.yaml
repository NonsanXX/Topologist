apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: topologist-scheduler
  namespace: devops-tools
spec:
  project: topologist
  source:
    repoURL: 'https://github.com/NonsanXX/Topologist'
    targetRevision: HEAD
    path: scheduler/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: topologist
  syncPolicy:
    automated:
      prune: true
      selfHeal: true